name: Release

# Builds the Windows installer on version tags, e.g. v0.1.0.
#
# The workflow needs no secrets beyond GitHub's standard GITHUB_TOKEN: it
# compiles, bundles the NSIS installer, and attaches it to the release the
# tag triggers.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Balance ${{ github.ref_name }}"
          releaseBody: "ดู README สำหรับวิธีติดตั้งและใช้งาน / See the README for installation and usage."
          releaseDraft: false
          prerelease: false
