[package]
name = "balance"
version = "0.1.0"
description = "แอปบันทึกและติดตามยอดเงินคงเหลือ (Local-first personal finance tracker)"
authors = ["Balance contributors"]
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/REPLACE_WITH_OWNER/balance"
publish = false

[lib]
# Tauri needs the app logic in a lib target so the binary stays a thin shim.
name = "balance_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }

# Used directly for `VACUUM INTO` during backup. Must match the sqlite driver
# that tauri-plugin-sql links, so both sides share one SQLite.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

# NOTE: zip 2.x is entirely yanked on crates.io — 9.x is the current line.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# The `#[tokio::test]` attribute in `commands::db` needs the runtime as a direct
# dependency; it is already in the tree through sqlx.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
